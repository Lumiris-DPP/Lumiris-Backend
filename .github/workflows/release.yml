---
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish (e.g. v0.4.2)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lumiris-api

jobs:
  release:
    name: Build, push & sign
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.ident.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version and image reference
        id: ident
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${DISPATCH_TAG}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a semver tag (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=${VERSION}"
            echo "image=${REGISTRY}/${OWNER}/${IMAGE_NAME}"
            echo "sha_short=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run the test suite before publishing
        run: ./mvnw -B -ntp verify

      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ident.outputs.image }}:${{ steps.ident.outputs.version }}
            ${{ steps.ident.outputs.image }}:${{ steps.ident.outputs.sha_short }}
          provenance: mode=max
          sbom: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ident.outputs.version }}
            org.opencontainers.image.title=lumiris-api
            org.opencontainers.image.licenses=UNLICENSED

      - name: Trivy — block on fixable CRITICAL vulnerabilities in app dependencies
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ident.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          vuln-type: library
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate the SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ steps.ident.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-api-${{ steps.ident.outputs.version }}
          path: sbom.spdx.json
          retention-days: 90

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest (keyless)
        run: |
          cosign sign --yes \
            "${{ steps.ident.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Attest the SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ steps.ident.outputs.image }}@${{ steps.build.outputs.digest }}"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.ident.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarise the release
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## lumiris-api ${{ steps.ident.outputs.version }}

          | Field | Value |
          |---|---|
          | Image | `${{ steps.ident.outputs.image }}` |
          | Tags | `${{ steps.ident.outputs.version }}`, `${{ steps.ident.outputs.sha_short }}` |
          | Digest | `${{ steps.build.outputs.digest }}` |

          Deploy it from the **prod-deploy** workflow in `Lumiris-Infra` with
          `api_tag = ${{ steps.ident.outputs.version }}`.
          SUMMARY
