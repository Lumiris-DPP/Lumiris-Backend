---
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish (e.g. v0.4.2)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lumiris-api

jobs:
  release:
    name: Build, push & sign
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.ident.outputs.version }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve the version and image reference
        id: ident
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${DISPATCH_TAG}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a semver tag (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "version=${VERSION}"
            echo "image=${REGISTRY}/${OWNER}/${IMAGE_NAME}"
            echo "sha_short=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run the test suite before publishing
        run: ./mvnw -B -ntp verify

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.ident.outputs.image }}:${{ steps.ident.outputs.version }}
            ${{ steps.ident.outputs.image }}:${{ steps.ident.outputs.sha_short }}
          provenance: mode=max
          sbom: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ident.outputs.version }}
            org.opencontainers.image.title=lumiris-api
            org.opencontainers.image.licenses=UNLICENSED

      - name: Trivy — block on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.ident.outputs.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate the SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.ident.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: sbom-api-${{ steps.ident.outputs.version }}
          path: sbom.spdx.json
          retention-days: 90

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the digest (keyless)
        run: |
          cosign sign --yes \
            "${{ steps.ident.outputs.image }}@${{ steps.build.outputs.digest }}"

      - name: Attest the SBOM
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ steps.ident.outputs.image }}@${{ steps.build.outputs.digest }}"

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ steps.ident.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarise the release
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## lumiris-api ${{ steps.ident.outputs.version }}

          | Field | Value |
          |---|---|
          | Image | `${{ steps.ident.outputs.image }}` |
          | Tags | `${{ steps.ident.outputs.version }}`, `${{ steps.ident.outputs.sha_short }}` |
          | Digest | `${{ steps.build.outputs.digest }}` |

          Deploy it from the **prod-deploy** workflow in `Lumiris-Infra` with
          `api_tag = ${{ steps.ident.outputs.version }}`.
          SUMMARY
