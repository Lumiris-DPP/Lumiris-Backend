spring:
    application:
        name: lumiris-backend

    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}

    data:
        redis:
            host: ${REDIS_HOST:localhost}
            port: ${REDIS_PORT:6379}
            password: ${REDIS_PASSWORD:}
            timeout: 2s

    cache:
        type: redis

    servlet:
        multipart:
            max-file-size: 20MB
            max-request-size: 60MB

    flyway:
        enabled: true
        # Schema migrations only by default. Demo seeds (db/seed) are opt-in for dev:
        # FLYWAY_LOCATIONS=classpath:db/migration,classpath:db/seed
        locations: ${FLYWAY_LOCATIONS:classpath:db/migration}
        # Tolerate seeds being absent from the resolved locations on envs that already applied them.
        ignore-migration-patterns: '*:missing'

    devtools:
        restart:
            # Le rechargement à chaud partait sur un target/classes à moitié recopié (IDE et
            # spring-boot:run écrivent au même endroit), d'où des redémarrages en échec sur un
            # placeholder non résolu. On attend que la copie se stabilise avant de relancer.
            quiet-period: 2s
            poll-interval: 3s

app:
    mail:
        from: ${MAIL_FROM:noreply@lumiris.com}

    # Origine de l'app consommateur (Vision/mobile), qui sert /p et les autres routes publiques.
    # Les hrefs de notification restent relatifs pour l'in-app (voir Notification.href) — c'est
    # uniquement pour les emails, qui n'ont pas d'origine à préfixer eux-mêmes, qu'on a besoin
    # d'une URL absolue.
    frontend-url: ${FRONTEND_URL:http://localhost:3002}

    # Origine publique de l'API elle-même (api.lumiris.eu en prod) — pour les liens one-click
    # servis directement par le back, comme la désinscription de la prospection retoucheurs.
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

    # Origine de l'app ATELIER (client), où artisans et retoucheurs s'inscrivent et gèrent leur
    # compte — cible du lien « réclamer ma fiche » des e-mails de prospection.
    repairer-app-url: ${REPAIRER_APP_URL:http://localhost:3003}

    # Cycle de vie des commandes marketplace. return-window-days porte le droit de rétractation
    # légal (14 jours) ; les deux échéances suivantes empêchent une commande de rester ouverte
    # indéfiniment quand ni l'acheteur ni le transporteur ne confirment quoi que ce soit.
    marketplace:
        return-window-days: ${MARKETPLACE_RETURN_WINDOW_DAYS:14}
        auto-deliver-after-ship-days: ${MARKETPLACE_AUTO_DELIVER_DAYS:7}
        auto-complete-after-delivery-days: ${MARKETPLACE_AUTO_COMPLETE_DAYS:14}
        commission-rate: ${MARKETPLACE_COMMISSION_RATE:0.05}
        # Affichage du paiement fractionné uniquement : Stripe (Klarna) encaisse et porte le
        # risque, Lumiris ne prête rien. Mettre installment-count à 1 masque la mention partout.
        installment-count: ${MARKETPLACE_INSTALLMENT_COUNT:3}
        installment-min-cents: ${MARKETPLACE_INSTALLMENT_MIN_CENTS:5000}

    # Étiquette d'expédition + suivi transporteur réel. Sans clés, la fonctionnalité s'efface :
    # l'atelier retrouve la saisie manuelle du suivi et le balayage J+7 continue de présumer la
    # livraison. Rien à activer pour tourner en local.
    shipping:
        default-weight-grams: ${SHIPPING_DEFAULT_WEIGHT_GRAMS:800}
        webhook-secret: ${SHIPPING_WEBHOOK_SECRET:}
        sendcloud:
            public-key: ${SENDCLOUD_PUBLIC_KEY:}
            secret-key: ${SENDCLOUD_SECRET_KEY:}
            base-url: ${SENDCLOUD_BASE_URL:}

cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3001,http://localhost:3002,http://localhost:3003}

lumiris:
    # Filet anti-flood applicatif (RateLimitFilter). Le WAF Cloudflare reste la bordure dure.
    rate-limit:
        enabled: ${RATE_LIMIT_ENABLED:true}
        per-minute: ${RATE_LIMIT_PER_MINUTE:100}
    rgpd:
        # Délai entre la suppression douce (DELETE /me) et l'anonymisation définitive.
        soft-delete-retention-days: ${RGPD_SOFT_DELETE_RETENTION_DAYS:30}
    repairer:
        # Validité d'un lien de réclamation de fiche annuaire.
        claim-token-ttl-days: ${REPAIRER_CLAIM_TOKEN_TTL_DAYS:30}
        # Purge des fiches annuaire jamais réclamées ni recontactées récemment.
        unclaimed-retention-months: ${REPAIRER_UNCLAIMED_RETENTION_MONTHS:18}

security:
    jwt:
        # No committed default: the app fails fast at startup if JWT_SECRET is unset (see .env.example).
        secret: ${JWT_SECRET}
        expiration: 900000
        refresh-expiration: 604800000

# ── Stripe monetisation ────────────────────────────────────────────────────
# Keys injected from the environment (never committed). `bootstrap-catalog`
# idempotently ensures the recurring prices exist for each product on startup.
stripe:
    secret-key: ${STRIPE_SECRET_KEY}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET}
    bootstrap-catalog: ${STRIPE_BOOTSTRAP_CATALOG:true}
    portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:3003/subscription}
    products:
        solo: ${STRIPE_PRODUCT_SOLO}
        studio: ${STRIPE_PRODUCT_STUDIO}
        maison: ${STRIPE_PRODUCT_MAISON}
        atelier-plus: ${STRIPE_PRODUCT_ATELIER_PLUS}
        local: ${STRIPE_PRODUCT_LOCAL}

minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Hôte public qui signe les URLs présignées : une URL signée pour l'endpoint interne
    # (http://minio:9000) est injoignable depuis un navigateur. Vide = signe avec `endpoint`.
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:lumiris}
    secret-key: ${MINIO_SECRET_KEY:lumiris_local_dev_only}
    bucket: ${MINIO_BUCKET:lumiris}

# Emails transactionnels (Resend). Vide par défaut : l'envoi échoue et se contente d'un log
# (voir MailService), comme les autres intégrations optionnelles ci-dessus — jamais bloquant.
resend:
    api-key: ${RESEND_API_KEY:}
    # Signing secret du webhook Resend (Dashboard → Webhooks → Signing Secret, format whsec_…).
    # Vide → la signature n'est pas vérifiée (dev). À CONFIGURER en prod.
    webhook-secret: ${RESEND_WEBHOOK_SECRET:}

# Web Push (VAPID). Vide par défaut : PushNotificationService détecte l'absence de clés et
# n'envoie rien, sans bloquer — même logique que Resend/Sendcloud ci-dessus. Générer une paire
# avec `npx web-push generate-vapid-keys`.
webpush:
    vapid:
        public-key: ${VAPID_PUBLIC_KEY:}
        private-key: ${VAPID_PRIVATE_KEY:}
        subject: ${VAPID_SUBJECT:mailto:contact@lumiris.app}

# Nominatim (OpenStreetMap) usage policy requires a descriptive User-Agent identifying the app.
geocoding:
    user-agent: ${GEOCODING_USER_AGENT:Lumiris/1.0 (contact@lumiris.app)}

blockchain:
    rpc-url: ${BLOCKCHAIN_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}
    wallet:
        private-key: ${BLOCKCHAIN_WALLET_PRIVATE_KEY}

server:
    error:
        include-message: always
        include-binding-errors: always
        include-stacktrace: on_param
        include-exception: false

management:
    endpoints:
        web:
            exposure:
                include: health,info,prometheus
    endpoint:
        health:
            probes:
                enabled: true
            show-details: when_authorized
    prometheus:
        metrics:
            export:
                enabled: true
    tracing:
        sampling:
            # 1.0 in dev/staging catches everything; drop it in prod (env override) once volume matters.
            probability: ${OTEL_TRACES_SAMPLING_PROBABILITY:1.0}
    otlp:
        tracing:
            # otel-collector (Lumiris-Infra) forwards to Tempo — see monitoring/otel/otel-collector-config.yml.
            endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

sentry:
    dsn: ${SENTRY_DSN:}
    environment: ${SENTRY_ENVIRONMENT:production}
    send-default-pii: false
    traces-sample-rate: 0.1
