spring:
  application:
    name: lumiris-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}


cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:3002,http://localhost:3003}

security:
  jwt:
    secret: ${JWT_SECRET:lumiris-secret-key-change-in-production-min-256-bits}
    expiration: 86400000

server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false
