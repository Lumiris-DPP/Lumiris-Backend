<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: layout(title=${title}, content=~{::main})}">
<body>
<main>
    <p>Bonjour <span th:text="${name}">Nom</span>,</p>
    <p>Votre certificat <strong th:text="${certificateName}">Certificat</strong> arrive à expiration
        le <span th:text="${expiryDate}">Date</span>.</p>
    <p>Pensez à le renouveler pour continuer à en bénéficier.</p>
    <p>L'équipe Lumiris</p>
</main>
</body>
</html>
