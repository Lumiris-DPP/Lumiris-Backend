<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/_layout :: layout(title=${title}, content=~{::main})}">
<body>
<main>
    <p>Bonjour <span th:text="${name}">Nom</span>,</p>
    <p>Votre paiement de <strong th:text="${amount}">Montant</strong>
        (réf. <span th:text="${orderRef}">Référence</span>) a bien été validé.</p>
    <p>Merci pour votre confiance.<br/>L'équipe Lumiris</p>
</main>
</body>
</html>
